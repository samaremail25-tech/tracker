<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Antigravity Quota Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1117;
    --panel: #161B22;
    --panel-2: #1C2128;
    --panel-border: #30363D;
    --amber: #FFA657;
    --amber-dim: rgba(255,166,87,.18);
    --green: #3FB950;
    --green-dim: rgba(63,185,80,.18);
    --blue: #58A6FF;
    --blue-dim: rgba(88,166,255,.18);
    --muted: #8B949E;
    --text: #E6EDF3;
    --text-dim: #7D8590;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans);
    font-size: 17px;
    min-height: 100vh;
  }
  body {
    background:
      radial-gradient(1100px 560px at 10% -10%, rgba(63,185,80,.12), transparent 60%),
      radial-gradient(900px 500px at 106% 0%, rgba(88,166,255,.10), transparent 55%),
      radial-gradient(700px 700px at 50% 120%, rgba(255,166,87,.08), transparent 60%),
      var(--bg);
  }
  .qt-mono { font-family: var(--font-mono); }
  #app { max-width: 780px; margin: 0 auto; padding: 36px 20px 60px; }
  button, input { font-family: inherit; }
  input[type="date"], input[type="time"] { color-scheme: dark; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  svg { display: block; }

  .qt-topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
  .qt-eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .22em; color: var(--green); opacity: .85; margin-bottom: 6px; font-weight: 600; }
  .qt-title { font-size: 27px; font-weight: 800; letter-spacing: -.015em; }

  .qt-clock { text-align: right; flex-shrink: 0; }
  .qt-clock-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; color: var(--muted); margin-bottom: 7px; }
  .qt-clock-tiles { display: flex; gap: 3px; justify-content: flex-end; align-items: center; }
  .qt-clock-tile { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--text); background: linear-gradient(180deg, #1C2724, var(--panel-2)); border: 1px solid var(--panel-border); border-radius: 6px; padding: 5px 6px; min-width: 18px; text-align: center; line-height: 1; }
  .qt-clock-colon { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--muted); align-self: center; }
  .qt-clock-date { margin-top: 7px; font-size: 12.5px; color: var(--text-dim); }

  .qt-hero { background: linear-gradient(155deg, #1A1F26, var(--panel)); border: 1px solid var(--panel-border); border-radius: 16px; padding: 24px 26px; margin-bottom: 22px; box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px rgba(0,0,0,.5), 0 0 0 1px rgba(88,166,255,.08); position: relative; overflow: hidden; }
  .qt-hero::before { content: ''; position: absolute; top: -60%; right: -10%; width: 260px; height: 260px; background: radial-gradient(circle, rgba(88,166,255,.12), transparent 70%); pointer-events: none; }
  .qt-hero-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .18em; color: var(--text-dim); margin-bottom: 14px; font-weight: 600; }
  .qt-hero-chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .qt-chip { font-family: var(--font-mono); font-size: 13.5px; padding: 8px 13px; border-radius: 8px; border: 1px solid rgba(79,224,172,.4); color: var(--green); background: var(--green-dim); font-weight: 600; }
  .qt-flap-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
  .qt-flap-tile { font-family: var(--font-mono); font-size: 30px; font-weight: 800; color: var(--amber); background: linear-gradient(180deg, #212E28, #182220); border: 1px solid var(--panel-border); border-radius: 8px; padding: 6px 5px; min-width: 27px; text-align: center; line-height: 1; position: relative; box-shadow: 0 2px 0 rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.25); }
  .qt-flap-tile::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.5); }
  .qt-flap-gap { width: 10px; }
  .qt-hero-sub { font-size: 15px; color: var(--text-dim); font-weight: 500; }
  .qt-hero-target { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .qt-hero-then { margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--panel-border); font-size: 13px; color: var(--muted); }

  .qt-board { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
  .qt-empty { font-size: 14px; color: var(--text-dim); border: 1px dashed var(--panel-border); border-radius: 13px; padding: 26px; text-align: center; line-height: 1.5; }

  .qt-row { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: start; background: var(--panel); border: 1px solid var(--panel-border); border-left: 3px solid var(--muted); border-radius: 12px; padding: 15px 16px; transition: border-color .2s ease, transform .15s ease, box-shadow .2s ease; }
  .qt-row:hover { box-shadow: 0 8px 22px rgba(0,0,0,.28); transform: translateY(-1px); }
  .qt-row-ready { border-left-color: var(--green); }
  .qt-row-waiting { border-left-color: var(--amber); }

  .qt-row-label { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
  .qt-row-label-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .qt-row-name { font-weight: 700; font-size: 15px; word-break: break-word; }
  .qt-row-ready-line { font-size: 11.5px; color: var(--green); font-family: var(--font-mono); font-weight: 600; }
  .qt-row-waiting-line { font-size: 11.5px; color: var(--text-dim); font-family: var(--font-mono); }

  .qt-cells { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .qt-cell { background: var(--panel-2); border: 1px solid var(--panel-border); border-radius: 10px; padding: 11px 12px; }
  .qt-cell-ready { border-color: rgba(79,224,172,.4); }
  .qt-cell-exhausted { border-color: rgba(255,180,84,.35); }
  .qt-cell-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .qt-cell-label { font-size: 12.5px; color: var(--text-dim); font-weight: 600; }
  .qt-icon-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 6px; margin: -6px; border-radius: 7px; display: flex; transition: color .15s ease, background .15s ease; }
  .qt-icon-btn:hover { color: var(--text); background: rgba(255,255,255,.09); }
  .qt-status { display: flex; align-items: center; gap: 7px; font-size: 14.5px; font-weight: 700; }
  .qt-status-ready { color: var(--green); }
  .qt-status-exhausted { color: var(--amber); }
  .qt-status-unknown { color: var(--muted); font-weight: 500; }
  .qt-cell-target { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-top: 5px; }
  .qt-remaining { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--text-dim); }
  .qt-remaining input { width: 46px; background: var(--bg); border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text); padding: 4px 6px; font-size: 12.5px; }

  .qt-editor { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--panel-border); }
  .qt-editor-hint { font-size: 10.5px; color: var(--muted); margin-bottom: 8px; line-height: 1.4; }
  .qt-editor-row { display: flex; align-items: stretch; gap: 8px; margin-bottom: 9px; }
  .qt-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
  .qt-field label { font-size: 10px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  .qt-field input { width: 100%; background: var(--bg); border: 1px solid var(--panel-border); border-radius: 6px; color: var(--text); padding: 6px 7px; font-size: 12px; font-family: var(--font-mono); }
  .qt-field input::placeholder { color: var(--muted); opacity: 0.6; }
  .qt-field input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 2px rgba(88,166,255,.15); }
  .qt-editor-warn { font-size: 10.5px; color: var(--amber); margin-bottom: 8px; }
  .qt-editor-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .qt-btn { font-size: 11.5px; font-weight: 700; border-radius: 7px; padding: 6px 10px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .qt-btn-amber { background: var(--amber-dim); color: var(--amber); border-color: rgba(242,169,59,.35); }
  .qt-btn-amber:hover { background: rgba(242,169,59,.22); }
  .qt-btn-green { background: var(--green-dim); color: var(--green); border-color: rgba(69,209,158,.35); }
  .qt-btn-green:hover { background: rgba(69,209,158,.22); }

  .qt-add { display: flex; gap: 8px; }
  .qt-add input { flex: 1; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 9px; color: var(--text); padding: 10px 13px; font-size: 13px; }
  .qt-add input::placeholder { color: var(--muted); }
  .qt-add button { display: flex; align-items: center; gap: 6px; background: var(--amber); color: #1A1200; font-weight: 800; font-size: 13px; border: none; border-radius: 9px; padding: 10px 15px; cursor: pointer; }
  .qt-add button:hover { opacity: .9; }
  .qt-add button:disabled { opacity: .5; cursor: default; }

  .qt-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 11px; color: var(--muted); gap: 10px; flex-wrap: wrap; line-height: 1.5; }
  .qt-version { font-family: var(--font-mono); font-size: 9px; color: var(--muted); opacity: .5; }
  .qt-clear-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 11px; text-decoration: underline; flex-shrink: 0; }
  .qt-clear-btn:hover { color: var(--text-dim); }
  .qt-error { margin-top: 10px; font-size: 14px; color: var(--amber); background: var(--amber-dim); border: 1px solid rgba(255,166,87,.35); border-radius: 8px; padding: 12px 14px; font-weight: 600; }
  .qt-loading { font-size: 13px; color: var(--text-dim); text-align: center; padding: 40px 0; }

  @media (max-width: 480px) {
    .qt-row { grid-template-columns: 1fr; }
    .qt-cells { grid-template-columns: 1fr; }
    .qt-flap-tile { font-size: 21px; }
    .qt-topline { flex-direction: column; }
    .qt-clock { text-align: left; }
    .qt-clock-tiles { justify-content: flex-start; }
    .qt-editor-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div id="app"><div class="qt-loading">Loading your tracked accounts…</div></div>

<!-- Firebase (compat SDK, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  var firebaseConfig = {
    apiKey: "AIzaSyA3GIq3HOF351BF1ivqsruyf9bt8eSioE8",
    authDomain: "antigravity-tracker-c119c.firebaseapp.com",
    projectId: "antigravity-tracker-c119c",
    storageBucket: "antigravity-tracker-c119c.firebasestorage.app",
    messagingSenderId: "78078713102",
    appId: "1:78078713102:web:64ae7e088229ab49ae0b5f"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  // Everything lives in one document, so all your devices/browsers share it.
  var docRef = db.collection('antigravity-tracker').doc('data');
</script>
<script>
(function(){
  var GROUPS = [ {key:'gemini', label:'Gemini models'}, {key:'claude', label:'Claude / GPT-OSS'} ];
  var PKT_OFFSET_MS = 5 * 60 * 60 * 1000; // Pakistan Standard Time, UTC+5, no DST
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  var ICON_EDIT = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  var ICON_TRASH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
  var ICON_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var ICON_CLOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';
  var ICON_PLUS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';

  var state = { accounts: [], editing: null, editDraft: {date:'', time:''}, newLabel: '', error: null, saving: false, ready: false };

  function freshGroup(){ return { status:'unchecked', refreshAt:null, remaining:100 }; }
  function freshAccount(label){
    return { id: 'acc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), label: label, gemini: freshGroup(), claude: freshGroup() };
  }

  function pad(n){ return n < 10 ? '0'+n : ''+n; }

  // ---- Pakistan-time helpers (independent of the device's own timezone) ----
  function pktParts(epochMs){
    var d = new Date(epochMs + PKT_OFFSET_MS);
    return { y:d.getUTCFullYear(), mo:d.getUTCMonth()+1, day:d.getUTCDate(), wd:d.getUTCDay(), hh:d.getUTCHours(), mm:d.getUTCMinutes(), ss:d.getUTCSeconds() };
  }
  function pktInputToEpoch(dateStr, timeStr){
    if (!dateStr || !timeStr) return null;
    var dp = dateStr.split('-').map(Number);
    var tp = timeStr.split(':').map(Number);
    if (dp.length < 3 || isNaN(dp[0])) return null;
    var y=dp[0], mo=dp[1], day=dp[2], hh=tp[0]||0, mm=tp[1]||0, ss=tp[2]||0;
    return Date.UTC(y, mo-1, day, hh, mm, ss) - PKT_OFFSET_MS;
  }
  function dateInputValue(epochMs){
    var p = pktParts(epochMs);
    return p.y+'-'+pad(p.mo)+'-'+pad(p.day);
  }
  function timeInputValue(epochMs){
    var p = pktParts(epochMs);
    return pad(p.hh)+':'+pad(p.mm)+':'+pad(p.ss);
  }
  function formatPKTShort(epochMs){
    var p = pktParts(epochMs);
    var hh = p.hh % 12 || 12;
    var ampm = p.hh < 12 ? 'AM' : 'PM';
    return p.day+' '+MONTHS[p.mo-1]+', '+pad(hh)+':'+pad(p.mm)+' '+ampm+' PKT';
  }

  // ---- Persistent storage (Firebase Firestore — independent of any Claude account) ----
  async function load(){
    try {
      var snap = await docRef.get();
      if (snap.exists && snap.data() && snap.data().accounts) {
        state.accounts = JSON.parse(snap.data().accounts);
      } else {
        state.accounts = [];
      }
      state.error = null;
    } catch(e) {
      state.accounts = [];
      state.error = 'Could not load from Firestore. Check your firebaseConfig and security rules (see setup steps).';
    }
    state.ready = true;
    // Keep this browser in sync if the doc changes elsewhere (e.g. another device).
    docRef.onSnapshot(function(snap){
      if (snap.exists && snap.data() && snap.data().accounts) {
        var incoming = JSON.parse(snap.data().accounts);
        if (JSON.stringify(incoming) !== JSON.stringify(state.accounts)) {
          state.accounts = incoming;
          render();
        }
      }
    });
  }
  async function save(){
    state.saving = true;
    try {
      await docRef.set({ accounts: JSON.stringify(state.accounts), updatedAt: Date.now() });
      state.error = null;
    } catch(e) {
      state.error = 'Could not save to Firestore — check your connection and security rules.';
    }
    state.saving = false;
    render();
  }

  function reconcile(now){
    var changed = false;
    state.accounts.forEach(function(acc){
      GROUPS.forEach(function(g){
        var group = acc[g.key];
        if (group.status === 'exhausted' && group.refreshAt && group.refreshAt <= now) {
          acc[g.key] = { status:'ready', refreshAt:null, remaining:100 };
          changed = true;
        }
      });
    });
    return changed;
  }

  function formatCountdown(ms){
    if (ms <= 0) return '0m';
    var totalMin = Math.floor(ms/60000);
    var d = Math.floor(totalMin/1440);
    var h = Math.floor((totalMin%1440)/60);
    var m = totalMin%60;
    if (d>0) return d+'d '+pad(h)+'h '+pad(m)+'m';
    if (h>0) return h+'h '+pad(m)+'m';
    return m+'m';
  }

  function accountSortKey(acc, now){
    var readyAny = false, soonest = Infinity;
    GROUPS.forEach(function(g){
      var group = acc[g.key];
      if (group.status==='ready') readyAny = true;
      else if (group.status==='exhausted') soonest = Math.min(soonest, group.refreshAt);
    });
    if (readyAny) return -1;
    return soonest;
  }

  function esc(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function flapHTML(text, small){
    var out = '';
    var tileClass = small ? 'qt-clock-tile' : 'qt-flap-tile';
    for (var i=0;i<text.length;i++){
      var ch = text[i];
      if (ch===' ') out += '<span class="qt-flap-gap"></span>';
      else if (ch===':' && small) out += '<span class="qt-clock-colon">:</span>';
      else out += '<span class="'+tileClass+'">'+esc(ch)+'</span>';
    }
    return out;
  }

  function cellHTML(acc, groupKey, label, now){
    var g = acc[groupKey];
    var cellId = acc.id+'-'+groupKey;
    var isEditing = state.editing === cellId;
    var html = '<div class="qt-cell qt-cell-'+g.status+'">';
    html += '<div class="qt-cell-head"><span class="qt-cell-label">'+esc(label)+'</span>';
    html += '<button class="qt-icon-btn" data-action="toggle-editor" data-account="'+acc.id+'" data-group="'+groupKey+'" aria-label="Edit '+esc(label)+'">'+ICON_EDIT+'</button></div>';

    if (g.status==='exhausted'){
      html += '<div class="qt-status qt-status-exhausted">'+ICON_CLOCK+' <span class="qt-mono qt-countdown" data-refresh-at="'+g.refreshAt+'">'+formatCountdown(g.refreshAt-now)+'</span></div>';
      html += '<div class="qt-cell-target">until '+formatPKTShort(g.refreshAt)+'</div>';
    } else if (g.status==='ready'){
      html += '<div class="qt-status qt-status-ready">'+ICON_CHECK+' Ready</div>';
    } else {
      html += '<div class="qt-status qt-status-unknown">Not set</div>';
    }

    if (g.status==='ready'){
      html += '<div class="qt-remaining"><input type="number" min="0" max="100" value="'+g.remaining+'" class="qt-remaining-input" data-account="'+acc.id+'" data-group="'+groupKey+'" aria-label="Remaining percent"> <span>% left</span></div>';
    }

    if (isEditing){
      var draftDate = state.editDraft.date, draftTime = state.editDraft.time;
      var previewEpoch = pktInputToEpoch(draftDate, draftTime);
      html += '<div class="qt-editor">';
      html += '<div class="qt-editor-hint">Enter the date &amp; time Antigravity shows you in 24-hour format, e.g. "30/07/2026, 12:05:53" becomes date: 2026-07-30 and time: 12:05:53. System will display it as 12:05 PM PKT.</div>';
      html += '<div class="qt-editor-row">';
      html += '<div class="qt-field"><label>Date</label><input type="date" class="qt-draft-date" data-account="'+acc.id+'" data-group="'+groupKey+'" value="'+esc(draftDate)+'" aria-label="Refresh date"></div>';
      html += '<div class="qt-field"><label>Time (24h)</label><input type="text" pattern="[0-9]{2}:[0-9]{2}(:[0-9]{2})?" placeholder="HH:MM:SS" class="qt-draft-time" data-account="'+acc.id+'" data-group="'+groupKey+'" value="'+esc(draftTime)+'" aria-label="Refresh time (24-hour format)"></div>';
      html += '</div>';
      if (previewEpoch !== null && previewEpoch <= now){
        html += '<div class="qt-editor-warn">That time has already passed — pick a moment in the future.</div>';
      }
      html += '<div class="qt-editor-actions">';
      html += '<button class="qt-btn qt-btn-amber" data-action="set-exhausted" data-account="'+acc.id+'" data-group="'+groupKey+'">'+ICON_CLOCK+' Set exhausted</button>';
      html += '<button class="qt-btn qt-btn-green" data-action="set-ready" data-account="'+acc.id+'" data-group="'+groupKey+'">'+ICON_CHECK+' Mark ready now</button>';
      html += '</div></div>';
    }

    html += '</div>';
    return html;
  }

  function rowMeta(acc){
    var readyLabels = [], exhaustedLabels = [];
    GROUPS.forEach(function(g){
      var group = acc[g.key];
      if (group.status==='ready') readyLabels.push(g.label);
      else if (group.status==='exhausted') exhaustedLabels.push(g.label);
    });
    return { readyLabels: readyLabels, exhaustedLabels: exhaustedLabels };
  }

  function render(){
    if (!state.ready){
      document.getElementById('app').innerHTML = '<div class="qt-loading">Loading your tracked accounts…</div>';
      return;
    }

    var now = Date.now();
    var readyNow = [], upcoming = [];
    state.accounts.forEach(function(acc){
      GROUPS.forEach(function(g){
        var group = acc[g.key];
        if (group.status==='ready') readyNow.push({acc:acc.label, group:g.label});
        else if (group.status==='exhausted') upcoming.push({acc:acc.label, group:g.label, refreshAt:group.refreshAt});
      });
    });
    upcoming.sort(function(a,b){ return a.refreshAt-b.refreshAt; });
    var nextUp = upcoming[0];
    var thenUp = upcoming.slice(1,3);

    var sorted = state.accounts.slice().sort(function(a,b){ return accountSortKey(a,now)-accountSortKey(b,now); });

    var nowP = pktParts(now);
    var hh12 = nowP.hh % 12 || 12;
    var ampm = nowP.hh < 12 ? 'AM' : 'PM';
    var clockStr = pad(hh12)+':'+pad(nowP.mm)+':'+pad(nowP.ss)+' '+ampm;
    var weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var clockDateStr = weekdays[nowP.wd]+', '+nowP.day+' '+MONTHS[nowP.mo-1]+' '+nowP.y;

    var html = '';
    html += '<div class="qt-topline">';
    html += '<div><div class="qt-eyebrow">QUOTA ROTATION</div><div class="qt-title">Antigravity Multi-Account Tracker</div></div>';
    html += '<div class="qt-clock"><div class="qt-clock-label">PAKISTAN TIME</div>';
    html += '<div class="qt-clock-tiles" id="pkt-clock">'+flapHTML(clockStr, true)+'</div>';
    html += '<div class="qt-clock-date" id="pkt-clock-date">'+esc(clockDateStr)+'</div></div>';
    html += '</div>';

    html += '<div class="qt-hero">';
    if (readyNow.length>0){
      html += '<div class="qt-hero-label">READY NOW &middot; '+readyNow.length+'</div>';
      html += '<div class="qt-hero-chips">';
      readyNow.forEach(function(r){ html += '<span class="qt-chip">'+esc(r.acc)+' &middot; '+esc(r.group)+'</span>'; });
      html += '</div>';
    } else if (nextUp){
      html += '<div class="qt-hero-label">NEXT REFRESH</div>';
      html += '<div class="qt-flap-row" id="hero-flap" data-refresh-at="'+nextUp.refreshAt+'">'+flapHTML(formatCountdown(nextUp.refreshAt-now))+'</div>';
      html += '<div class="qt-hero-sub">'+esc(nextUp.acc)+' &middot; '+esc(nextUp.group)+'</div>';
      html += '<div class="qt-hero-target" id="hero-target">'+formatPKTShort(nextUp.refreshAt)+'</div>';
      if (thenUp.length>0){
        html += '<div class="qt-hero-then">then: ';
        html += thenUp.map(function(t){
          return '<span class="qt-then-item" data-refresh-at="'+t.refreshAt+'" data-label="'+esc(t.acc)+' &middot; '+esc(t.group)+'">'+esc(t.acc)+' &middot; '+esc(t.group)+' in '+formatCountdown(t.refreshAt-now)+'</span>';
        }).join('  &middot;  ');
        html += '</div>';
      }
    } else {
      html += '<div class="qt-hero-label">NO ACCOUNTS TRACKED YET &mdash; ADD ONE BELOW</div>';
    }
    html += '</div>';

    html += '<div class="qt-board">';
    if (state.accounts.length===0){
      html += '<div class="qt-empty">Add each Gmail account you rotate through, then log a group as exhausted with the refresh time Antigravity shows you.</div>';
    }
    sorted.forEach(function(acc){
      var meta = rowMeta(acc);
      var rowState = meta.readyLabels.length>0 ? 'qt-row-ready' : (meta.exhaustedLabels.length>0 ? 'qt-row-waiting' : '');
      html += '<div class="qt-row '+rowState+'">';
      html += '<div class="qt-row-label">';
      html += '<div class="qt-row-label-top"><span class="qt-row-name">'+esc(acc.label)+'</span>';
      html += '<button class="qt-icon-btn" data-action="remove-account" data-account="'+acc.id+'" aria-label="Remove '+esc(acc.label)+'">'+ICON_TRASH+'</button></div>';
      if (meta.readyLabels.length>0){
        html += '<div class="qt-row-ready-line">Ready: '+esc(meta.readyLabels.join(', '))+'</div>';
      } else if (meta.exhaustedLabels.length>0){
        html += '<div class="qt-row-waiting-line">Waiting on '+esc(meta.exhaustedLabels.join(', '))+'</div>';
      } else {
        html += '<div class="qt-row-waiting-line">Not tracked yet</div>';
      }
      html += '</div>';
      html += '<div class="qt-cells">';
      GROUPS.forEach(function(g){ html += cellHTML(acc, g.key, g.label, now); });
      html += '</div></div>';
    });
    html += '</div>';

    html += '<div class="qt-add">';
    html += '<input id="new-label-input" placeholder="Account label, e.g. gmail-3" value="'+esc(state.newLabel||'')+'">';
    html += '<button data-action="add-account"'+(state.saving?' disabled':'')+'>'+ICON_PLUS+' Add account</button>';
    html += '</div>';

    html += '<div class="qt-footer">';
    html += '<span>Manual log &mdash; Antigravity has no public quota API, so update a cell after you check the app. All times are Pakistan Standard Time (UTC+5). '+(state.saving ? 'Saving…' : 'Synced via Firestore — same data on every device.')+'</span>';
    if (state.accounts.length>0){
      html += '<button class="qt-clear-btn" data-action="clear-all">Clear all</button>';
    }
    html += '</div>';
    html += '<div class="qt-version">v2.1 • 24h input, 12h display • duplicate check</div>';

    if (state.error){ html += '<div class="qt-error">'+esc(state.error)+'</div>'; }

    document.getElementById('app').innerHTML = html;
  }

  function updateCountdowns(){
    var now = Date.now();
    document.querySelectorAll('.qt-countdown[data-refresh-at]').forEach(function(el){
      el.textContent = formatCountdown(Number(el.getAttribute('data-refresh-at'))-now);
    });
    var heroFlap = document.getElementById('hero-flap');
    if (heroFlap){
      heroFlap.innerHTML = flapHTML(formatCountdown(Number(heroFlap.getAttribute('data-refresh-at'))-now));
    }
    document.querySelectorAll('.qt-then-item[data-refresh-at]').forEach(function(el){
      var refreshAt = Number(el.getAttribute('data-refresh-at'));
      var label = el.getAttribute('data-label');
      el.textContent = label+' in '+formatCountdown(refreshAt-now);
    });
    var clockEl = document.getElementById('pkt-clock');
    if (clockEl){
      var p = pktParts(now);
      var hh12 = p.hh % 12 || 12;
      var ampm = p.hh < 12 ? 'AM' : 'PM';
      clockEl.innerHTML = flapHTML(pad(hh12)+':'+pad(p.mm)+':'+pad(p.ss)+' '+ampm, true);
    }
  }

  function addAccount(){
    var input = document.getElementById('new-label-input');
    var label = input ? input.value.trim() : '';
    if (!label) return;
    // Check for duplicate email
    var exists = state.accounts.some(function(a){ return a.label.toLowerCase() === label.toLowerCase(); });
    if (exists){
      state.error = 'Account "'+label+'" already exists. Please use a different label.';
      render();
      setTimeout(function(){ state.error = null; render(); }, 3000);
      return;
    }
    state.error = null;
    state.accounts.push(freshAccount(label));
    state.newLabel = '';
    save();
  }
  function removeAccount(id){
    state.accounts = state.accounts.filter(function(a){ return a.id!==id; });
    save();
  }
  function setExhausted(accId, groupKey){
    var epoch = pktInputToEpoch(state.editDraft.date, state.editDraft.time);
    if (epoch === null){
      state.error = 'Enter both a date and a time before setting the refresh.';
      render();
      return;
    }
    if (epoch <= Date.now()){
      state.error = 'That refresh time has already passed — pick a moment in the future.';
      render();
      return;
    }
    var acc = state.accounts.filter(function(a){ return a.id===accId; })[0];
    if (!acc) return;
    acc[groupKey] = { status:'exhausted', refreshAt: epoch, remaining:0 };
    state.editing = null;
    state.editDraft = {date:'', time:''};
    save();
  }
  function setReady(accId, groupKey){
    var acc = state.accounts.filter(function(a){ return a.id===accId; })[0];
    if (!acc) return;
    acc[groupKey] = { status:'ready', refreshAt:null, remaining:100 };
    state.editing = null;
    save();
  }
  function setRemaining(accId, groupKey, val){
    var acc = state.accounts.filter(function(a){ return a.id===accId; })[0];
    if (!acc) return;
    var num = Math.max(0, Math.min(100, Number(val)||0));
    acc[groupKey].remaining = num;
    save();
  }
  function clearAll(){
    if (window.confirm('Clear every tracked account? This cannot be undone.')){
      state.accounts = [];
      save();
    }
  }

  document.getElementById('app').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var accId = el.getAttribute('data-account');
    var groupKey = el.getAttribute('data-group');
    if (action==='add-account') addAccount();
    else if (action==='remove-account') removeAccount(accId);
    else if (action==='toggle-editor'){
      var cellId = accId+'-'+groupKey;
      if (state.editing===cellId){
        state.editing = null;
      } else {
        state.editing = cellId;
        var now = Date.now();
        state.editDraft = { date: dateInputValue(now), time: timeInputValue(now) };
      }
      state.error = null;
      render();
    }
    else if (action==='set-exhausted') setExhausted(accId, groupKey);
    else if (action==='set-ready') setReady(accId, groupKey);
    else if (action==='clear-all') clearAll();
  });

  document.getElementById('app').addEventListener('input', function(e){
    var t = e.target;
    if (t.id==='new-label-input'){ state.newLabel = t.value; }
    else if (t.classList.contains('qt-draft-date')){ state.editDraft.date = t.value; }
    else if (t.classList.contains('qt-draft-time')){ 
      // Allow typing, just store the value
      state.editDraft.time = t.value; 
    }
    else if (t.classList.contains('qt-remaining-input')){
      setRemaining(t.getAttribute('data-account'), t.getAttribute('data-group'), t.value);
    }
  });

  // Validate and format time when user leaves the time field
  document.getElementById('app').addEventListener('blur', function(e){
    var t = e.target;
    if (t.classList.contains('qt-draft-time') && t.value){
      // Try to parse and normalize the time
      var timeStr = t.value.trim();
      // If user enters incomplete time like "23:05", add seconds
      if (/^\d{1,2}:\d{1,2}$/.test(timeStr)){
        var parts = timeStr.split(':');
        var hh = parseInt(parts[0]);
        var mm = parseInt(parts[1]);
        if (hh >= 0 && hh <= 23 && mm >= 0 && mm <= 59){
          t.value = pad(hh)+':'+pad(mm)+':00';
          state.editDraft.time = t.value;
        }
      }
      // If user enters full time like "23:05:30"
      else if (/^\d{1,2}:\d{1,2}:\d{1,2}$/.test(timeStr)){
        var parts = timeStr.split(':');
        var hh = parseInt(parts[0]);
        var mm = parseInt(parts[1]);
        var ss = parseInt(parts[2]);
        if (hh >= 0 && hh <= 23 && mm >= 0 && mm <= 59 && ss >= 0 && ss <= 59){
          t.value = pad(hh)+':'+pad(mm)+':'+pad(ss);
          state.editDraft.time = t.value;
        }
      }
    }
  }, true);

  document.getElementById('app').addEventListener('keydown', function(e){
    if (e.target && e.target.id==='new-label-input' && e.key==='Enter') addAccount();
  });

  (async function init(){
    await load();
    render();
    setInterval(async function(){
      var changed = reconcile(Date.now());
      if (changed){ await save(); }
      else { updateCountdowns(); }
    }, 1000);
  })();
})();
</script>
</body>
</html>
